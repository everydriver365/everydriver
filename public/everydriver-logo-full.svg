<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 180" width="680" height="180" role="img" aria-label="EveryDriver logo — dark version">
  <title>EveryDriver logo — dark version</title>
  <desc>Reversed wordmark on a navy background for dark applications.</desc>

  <rect x="0" y="0" width="680" height="180" fill="#0A2B6B"/>

  <text x="80" y="115" font-family="Helvetica, Arial, sans-serif" font-weight="800" font-size="64" fill="#FFFFFF" letter-spacing="-1">EVERY</text>
  <text x="270" y="115" font-family="Helvetica, Arial, sans-serif" font-weight="800" font-size="64" fill="#FFFFFF" letter-spacing="-1">DR</text>

  <g transform="translate(370, 56)">
    <circle cx="0" cy="0" r="8" fill="#E63946"/>
    <circle cx="0" cy="22" r="8" fill="#F4B83C"/>
    <circle cx="0" cy="44" r="8" fill="#3FB76B"/>
  </g>

  <text x="385" y="115" font-family="Helvetica, Arial, sans-serif" font-weight="800" font-size="64" fill="#FFFFFF" letter-spacing="-1">VER</text>
  <text x="530" y="115" font-family="Helvetica, Arial, sans-serif" font-weight="400" font-size="22" fill="#FFFFFF" letter-spacing="2" opacity="0.7">.co.uk</text>

  <line x1="80" y1="140" x2="600" y2="140" stroke="#FFFFFF" stroke-width="1" opacity="0.3"/>
</svg>
